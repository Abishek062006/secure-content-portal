# Activated by SPRING_PROFILES_ACTIVE=local (see .env.local / run-local.sh).
# A local run needs nothing from the cloud:
#  - MySQL on localhost (a dedicated `secureportal` database and user, see the README)
#  - local-disk storage instead of a bucket
spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/secureportal}
    username: ${LOCAL_DB_USERNAME:secureportal}
    password: ${LOCAL_DB_PASSWORD:secureportal}

storage:
  provider: local
