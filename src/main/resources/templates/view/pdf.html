<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${item.title} + ' — Secure Content Portal'">PDF</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-wide" id="pdf-viewer-root" th:attr="data-ticket=${ticket},data-total-pages=${item.pageCount}">
    <h1 th:text="${item.title}">Title</h1>

    <div class="pdf-toolbar">
        <button type="button" class="btn" id="prev-page">&larr; Previous</button>
        <span id="page-indicator">Page 1 of <span th:text="${item.pageCount}">1</span></span>
        <button type="button" class="btn" id="next-page">Next &rarr;</button>
    </div>

    <div class="pdf-page-wrap">
        <div id="pdf-loading" class="pdf-loading">Loading page…</div>
        <img id="pdf-page-image" alt="PDF page" hidden/>
    </div>
</div>

<script th:src="@{/js/pdf-viewer.js}"></script>
</body>
</html>
