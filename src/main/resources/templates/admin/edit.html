<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Edit content — Secure Content Portal</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container">
    <h1>Edit content</h1>
    <p class="field-hint" style="margin-top:-10px;">
        <span th:text="${item.originalFilename}">file.mp4</span> &middot;
        <span th:text="${item.sizeLabel}">0 MB</span>
        — the file itself can't be replaced here; delete and re-upload if you need to change it.
    </p>

    <form class="form-panel" method="post" th:action="@{'/admin/content/' + ${item.id}}" th:object="${editForm}">
        <div class="field">
            <label for="title">Title</label>
            <input id="title" type="text" th:field="*{title}" maxlength="200"/>
            <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>

        <div class="field">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" maxlength="2000" rows="4"></textarea>
        </div>

        <div class="field">
            <label for="category">Category / tag</label>
            <input id="category" type="text" th:field="*{category}" maxlength="80"/>
        </div>

        <div class="form-actions">
            <a class="btn" th:href="@{/admin/content}">Cancel</a>
            <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
    </form>
</div>
</body>
</html>
