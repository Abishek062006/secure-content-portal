<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Upload content — Secure Content Portal</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container">
    <h1>Upload content</h1>
    <form class="form-panel" method="post" th:action="@{/admin/content}" th:object="${uploadForm}"
          enctype="multipart/form-data">

        <div class="field">
            <label for="title">Title</label>
            <input id="title" type="text" th:field="*{title}" maxlength="200"/>
            <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>

        <div class="field">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" maxlength="2000" rows="4"></textarea>
        </div>

        <div class="field">
            <label for="category">Category / tag</label>
            <input id="category" type="text" th:field="*{category}" maxlength="80" placeholder="e.g. Onboarding"/>
        </div>

        <div class="field">
            <label for="contentType">Content type</label>
            <select id="contentType" th:field="*{contentType}" onchange="updateAccept()">
                <option th:each="type : ${contentTypes}" th:value="${type}" th:text="${type.label}"></option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('contentType')}" th:errors="*{contentType}"></p>
        </div>

        <div class="field">
            <label for="file">File</label>
            <input id="file" type="file" th:field="*{file}"/>
            <p class="field-hint">Video up to 512 MB (.mp4, .webm) &middot; PDF up to 32 MB &middot; HTML up to 2
                MB</p>
            <p class="field-error" th:if="${#fields.hasErrors('file')}" th:errors="*{file}"></p>
        </div>

        <div class="form-actions">
            <a class="btn" th:href="@{/admin/content}">Cancel</a>
            <button type="submit" class="btn btn-primary">Upload</button>
        </div>
    </form>
</div>

<script>
    var acceptMap = {VIDEO: '.mp4,.webm', PDF: '.pdf', HTML: '.html,.htm'};

    function updateAccept() {
        var select = document.getElementById('contentType');
        document.getElementById('file').setAttribute('accept', acceptMap[select.value] || '');
    }

    document.addEventListener('DOMContentLoaded', updateAccept);
</script>
</body>
</html>
