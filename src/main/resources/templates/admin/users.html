<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Users — Secure Content Portal</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container-wide">
    <div class="page-head">
        <h1>Users</h1>
    </div>

    <form class="search-bar" method="get" th:action="@{/admin/users}">
        <input type="search" name="search" placeholder="Search by name or email…" th:value="${search}"/>
        <button type="submit" class="btn btn-primary">Search</button>
        <a th:if="${search != null}" class="btn" th:href="@{/admin/users}">Clear</a>
    </form>

    <div th:if="${#lists.isEmpty(users)}" class="empty-state">
        <p>No users match your search.</p>
    </div>

    <div th:unless="${#lists.isEmpty(users)}" class="table-wrap">
        <table class="data-table">
            <thead>
            <tr>
                <th>Email</th>
                <th>Name</th>
                <th>Role</th>
                <th>Joined</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.email}">user@example.com</td>
                <td th:text="${u.displayName} ?: '—'">Name</td>
                <td><span class="badge" th:classappend="${u.admin} ? ' admin'" th:text="${u.role}">VIEWER</span></td>
                <td th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">date</td>
                <td class="row-actions">
                    <span th:if="${u.id == currentUserId}" class="field-hint">You</span>
                    <form th:if="${u.id != currentUserId and !u.admin}" method="post"
                          th:action="@{'/admin/users/' + ${u.id} + '/promote'}" style="margin:0;">
                        <button type="submit" class="btn btn-primary">Make admin</button>
                    </form>
                    <form th:if="${u.id != currentUserId and u.admin}" method="post"
                          th:action="@{'/admin/users/' + ${u.id} + '/demote'}" style="margin:0;">
                        <button type="submit" class="btn btn-danger-outline">Revoke admin</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
