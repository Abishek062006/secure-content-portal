<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Manage content — Secure Content Portal</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container-wide">
    <div class="page-head">
        <h1>Content</h1>
        <div class="row-actions">
            <a class="btn" th:href="@{/admin/audit}">Audit log</a>
            <a class="btn btn-primary" th:href="@{/admin/content/new}">Upload content</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(items)}" class="empty-state">
        <p>No content uploaded yet.</p>
        <a class="btn btn-primary" th:href="@{/admin/content/new}">Upload your first item</a>
    </div>

    <div th:unless="${#lists.isEmpty(items)}" class="table-wrap">
        <table class="data-table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Type</th>
                <th>Category</th>
                <th>Size</th>
                <th>Views</th>
                <th>Last viewed</th>
                <th>Uploaded</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.title}">Title</td>
                <td><span class="badge" th:text="${item.contentType}">VIDEO</span></td>
                <td th:text="${item.category} ?: '—'">Category</td>
                <td th:text="${item.sizeLabel}">0 MB</td>
                <td th:text="${item.viewCount}">0</td>
                <td th:text="${item.lastViewedAt} ? ${#temporals.format(item.lastViewedAt, 'dd MMM yyyy, HH:mm')} : '—'">—</td>
                <td th:text="${#temporals.format(item.createdAt, 'dd MMM yyyy, HH:mm')}">date</td>
                <td class="row-actions">
                    <a class="btn" th:href="@{'/content/' + ${item.id}}">View</a>
                    <a class="btn" th:href="@{'/admin/content/' + ${item.id} + '/edit'}">Edit</a>
                    <button type="button" class="btn btn-danger-outline"
                            th:attr="data-action=@{'/admin/content/' + ${item.id} + '/delete'},data-title=${item.title}"
                            onclick="openDeleteConfirm(this)">Delete
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/confirm-modal :: modal}"></div>
</body>
</html>
