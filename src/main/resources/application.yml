server:
  port: ${PORT:8080}

spring:
  application:
    name: secure-content-portal

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
            # Explicit rather than left to Spring's {baseUrl} auto-detection: in
            # production this request arrives at Render via a Vercel rewrite proxy
            # (so the session cookie ends up first-party to the frontend's own
            # domain, which browsers now require), and relying on Vercel forwarding
            # the right X-Forwarded-Host for baseUrl detection is one more thing
            # that could silently be wrong. Override with APP_OAUTH_REDIRECT_URI in
            # production; the default here is Spring's own built-in template,
            # unchanged for local dev.
            redirect-uri: ${APP_OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

  # Outer request-level ceiling — the real per-type limits are enforced by
  # FileValidator; this just stops an oversized request from being read into
  # memory/disk at all before it gets that far.
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

app:
  admin-emails: ${APP_ADMIN_EMAILS:}
  ticket-secret: ${APP_TICKET_SECRET:dev-only-insecure-ticket-secret-change-me}
  pdf-render-dpi: 90
  pdf-max-pages: 300
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

# Groq by default; any OpenAI-compatible provider works. Set AI_API_KEY and AI_MODEL to enable question generation.
ai:
  base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:}
  timeout-seconds: 120
  json-mode: ${AI_JSON_MODE:true}

storage:
  provider: ${STORAGE_PROVIDER:s3}
  local-path: ${STORAGE_LOCAL_PATH:./local-storage}
  endpoint: ${STORAGE_ENDPOINT:}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET:content}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  path-style-access: true

logging:
  level:
    com.secureportal: INFO
