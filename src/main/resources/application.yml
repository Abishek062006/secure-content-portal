server:
  port: ${PORT:8080}

spring:
  application:
    name: secure-content-portal

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile

app:
  admin-emails: ${APP_ADMIN_EMAILS:}
  ticket-secret: ${APP_TICKET_SECRET:dev-only-insecure-ticket-secret-change-me}
  ticket-ttl: 5m
  pdf-render-dpi: 110
  pdf-max-pages: 300

storage:
  endpoint: ${STORAGE_ENDPOINT:}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET:content}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  path-style-access: true

logging:
  level:
    com.secureportal: INFO
