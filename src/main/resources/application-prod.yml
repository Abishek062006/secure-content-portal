# Production behind CloudFront -> ALB -> ECS (see infra/terraform). TLS ends at CloudFront, so the app sees plain HTTP
# from the load balancer; without forward-headers-strategy Spring builds the OAuth redirect_uri as http:// and Google
# rejects it. (The redirect URI is also pinned explicitly with APP_OAUTH_REDIRECT_URI.)
server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        # The site and its API share one address (CloudFront routes /api/* to the load balancer), so the session
        # cookie is first-party. Lax is enough and keeps the built-in CSRF protection that SameSite=None would give up.
        same-site: lax
        http-only: true
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    # Keep a slow or stalled video client from holding a worker forever.
    connection-timeout: 20s
    threads:
      max: 200

logging:
  level:
    root: INFO
    com.secureportal: INFO
