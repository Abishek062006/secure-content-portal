# Render terminates TLS upstream of the app; without forward-headers-strategy
# Spring builds the OAuth redirect_uri as http:// and Google rejects it.
server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        # The React frontend (Vercel) and this API (Render) are different
        # registrable domains — genuinely cross-site, not just cross-port
        # like local dev. SameSite=Lax would never be sent on those
        # cross-site fetch() calls at all; None is required for the session
        # cookie to reach the API. Secure=true (above) is mandatory whenever
        # SameSite=None is used — browsers reject None on a non-HTTPS cookie.
        same-site: none
        http-only: true

logging:
  level:
    root: INFO
    com.secureportal: INFO
