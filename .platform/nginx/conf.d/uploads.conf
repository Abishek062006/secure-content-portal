# Elastic Beanstalk's Docker platform runs nginx in front of the app
# container. nginx defaults to a 1MB request body cap, which rejects
# video uploads with 413 before Spring Boot ever sees the request —
# Spring's own multipart limits (application.yml) allow up to 550MB.
# EB copies every *.conf here into nginx's conf.d on deploy.
client_max_body_size 550M;
